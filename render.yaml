services:
  - type: worker
    name: tohid-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TOHID_UPDATE_HOOK_URL
        sync: false
      - key: TOHID_UPDATE_HOOK_METHOD
        value: POST
